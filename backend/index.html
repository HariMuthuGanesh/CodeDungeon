<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Dungeon Main Backend Diagnostician</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto">
    <header class="mb-8 flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight">⚙️ Code Dungeon Backend Diagnostic Control</h1>
        <p class="text-slate-400 text-sm mt-1">Verify database configurations, endpoint statuses, and real-time connectivity.</p>
      </div>
      <span class="px-3 py-1 rounded-full text-xs font-bold bg-green-950/80 text-green-400 border border-green-800 animate-pulse">
        ● Online
      </span>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Endpoint Verifier Panel -->
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-lg space-y-4 lg:col-span-1">
        <h2 class="text-lg font-bold text-indigo-400 border-b border-slate-700 pb-2">Diagnostic Tests</h2>
        
        <div class="space-y-3">
          <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Public API Status</h3>
            <div class="flex flex-col gap-2">
              <button onclick="testEndpoint('/api/health')" class="text-left bg-slate-900 hover:bg-slate-700 text-slate-300 font-mono text-xs py-2 px-3 rounded border border-slate-700 transition">
                GET /api/health
              </button>
              <button onclick="testEndpoint('/api/rooms')" class="text-left bg-slate-900 hover:bg-slate-700 text-slate-300 font-mono text-xs py-2 px-3 rounded border border-slate-700 transition">
                GET /api/rooms
              </button>
              <button onclick="testEndpoint('/api/leaderboard')" class="text-left bg-slate-900 hover:bg-slate-700 text-slate-300 font-mono text-xs py-2 px-3 rounded border border-slate-700 transition">
                GET /api/leaderboard
              </button>
            </div>
          </div>

          <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Admin DB Check</h3>
            <div class="space-y-2">
              <input type="password" id="adminSecret" placeholder="Enter ADMIN_SECRET" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
              <button onclick="testAdminEndpoint('/api/admin/teams')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded text-xs transition">
                Test DB: Get Registered Teams
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- JSON Output Viewer -->
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-lg lg:col-span-2 flex flex-col min-h-[400px]">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
          <h2 class="text-lg font-bold text-indigo-400">Response Terminal</h2>
          <button onclick="clearConsole()" class="text-slate-400 hover:text-white text-xs underline">Clear Logs</button>
        </div>

        <div id="outputContainer" class="flex-1 bg-slate-950 border border-slate-900 rounded p-4 overflow-auto max-h-[500px]">
          <pre id="jsonViewer" class="text-xs font-mono text-slate-300 whitespace-pre-wrap">Select an API test on the left to output response details...</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const jsonViewer = document.getElementById('jsonViewer');

    function clearConsole() {
      jsonViewer.innerText = 'Select an API test on the left to output response details...';
      jsonViewer.className = 'text-xs font-mono text-slate-300';
    }

    async function testEndpoint(endpoint) {
      jsonViewer.innerText = `Requesting ${endpoint}...`;
      jsonViewer.className = 'text-xs font-mono text-slate-400';

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        
        jsonViewer.innerText = JSON.stringify(data, null, 2);
        jsonViewer.className = 'text-xs font-mono text-emerald-400';
      } catch (err) {
        jsonViewer.innerText = `Failed to fetch ${endpoint}:\n\n${err.message}`;
        jsonViewer.className = 'text-xs font-mono text-rose-400';
      }
    }

    async function testAdminEndpoint(endpoint) {
      const secret = document.getElementById('adminSecret').value;
      if (!secret) {
        alert('Please enter your ADMIN_SECRET.');
        return;
      }

      jsonViewer.innerText = `Requesting ${endpoint} with x-admin-secret header...`;
      jsonViewer.className = 'text-xs font-mono text-slate-400';

      try {
        const res = await fetch(endpoint, {
          headers: { 'x-admin-secret': secret }
        });
        const data = await res.json();

        jsonViewer.innerText = JSON.stringify(data, null, 2);
        if (res.ok && data.success) {
          jsonViewer.className = 'text-xs font-mono text-emerald-400';
        } else {
          jsonViewer.className = 'text-xs font-mono text-amber-400';
        }
      } catch (err) {
        jsonViewer.innerText = `Failed to fetch ${endpoint}:\n\n${err.message}`;
        jsonViewer.className = 'text-xs font-mono text-rose-400';
      }
    }
  </script>
</body>
</html>
